[project]
name = "gazebo-world-generator"
version = "0.1.0"
description = "Generate Gazebo worlds with realistic terrain, sky, and buildings from a lat/long bounding box"
requires-python = ">=3.11"
dependencies = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "rasterio>=1.3",
    "mercantile>=1.2",
    "mapbox-vector-tile>=2.0",
    "shapely>=2.0",
    "requests>=2.31",
    "pillow>=10.0",
    "opencv-python>=4.10",
    "geopy>=2.4",
    "geopandas>=1.0",
    "pyproj>=3.4",
    "trimesh>=4.0",
    "pycollada>=0.9",
    "mapbox-earcut>=1.0",
    "scipy>=1.10",
]

[project.scripts]
generate = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
